<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login — Hasan Portfolio</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='admin/admin.css') }}"
    >
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-brand">
                MH.
            </div>

            <p class="login-label">
                ADMINISTRATION
            </p>

            <h1>
                Welcome back.
            </h1>

            <p class="login-description">
                Sign in to manage your portfolio.
            </p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="login-error">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                    <span>→</span>
                </button>

            </form>

            <a
                href="{{ url_for('home') }}"
                class="back-link"
            >
                ← Back to portfolio
            </a>

        </div>

    </main>

</body>
</html>
